name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync

      - name: Clone ERC-7730 registry (for tests that need it)
        run: git clone --depth 1 https://github.com/ethereum/clear-signing-erc7730-registry.git

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest -q

      - name: Supply-chain audit
        run: uvx pip-audit --strict

      - name: Workflow security audit
        run: uvx zizmor --persona=auditor --min-severity=medium .github/workflows/
